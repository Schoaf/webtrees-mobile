name: Store

# Push a tag like v1.7.0 once its TestFlight and Play internal-testing builds
# are ready (see docs/RELEASING.md): renders the store screenshots, uploads
# them with the texts from fastlane/metadata, submits the tagged commit's
# TestFlight build for App Store review and promotes its internal-testing
# build to production on Google Play. Manually: an existing tag, and which
# stores (e.g. only one, when the other already went through).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, e.g. v1.7.0
        required: true
      stores:
        description: Stores
        type: choice
        options: [both, apple, google]
        default: both

jobs:
  store:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
      STORES: ${{ inputs.stores || 'both' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # The store tooling from this workflow's own commit - a manual run on an
      # older tag then gets its fixes too.
      - name: Current store tooling
        run: git checkout "$GITHUB_SHA" -- fastlane/Fastfile tool/upload_app_store_artwork.py tool/check_app_store_editable.py

      - name: Version and builds of this commit
        id: build
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          sha=$(git rev-parse HEAD)
          # CI uses the run number as build number (--build-number).
          for platform in ios android; do
            number=$(gh run list --workflow "deploy-$platform.yml" --commit "$sha" --status success \
              --json number --jq '.[0].number')
            if [ -z "$number" ]; then
              echo "No successful deploy-$platform run for $sha" >&2
              exit 1
            fi
            echo "$platform=$number" >> "$GITHUB_OUTPUT"
          done

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Render screenshots
        run: flutter test test/screenshots/store_screenshots_test.dart --dart-define=RENDER_SCREENSHOTS=true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Compose screenshots
        run: |
          pip install pillow
          python tool/compose_store_screenshots.py
          python tool/compose_store_banner.py
          python tool/prepare_store_uploads.py

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      # deliver would otherwise rename a version still in review to this one.
      - name: Check no App Store version is in review
        if: env.STORES != 'google'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          pip install pyjwt cryptography
          python tool/check_app_store_editable.py ${{ steps.build.outputs.version }}

      - name: App Store
        if: env.STORES != 'google'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane store_ios version:${{ steps.build.outputs.version }} build:${{ steps.build.outputs.ios }}

      # Header and search results artwork: deliver can't upload it yet. A
      # failure here (Apple's API for it is new) doesn't stop the release -
      # the artwork can still be set by hand in App Store Connect.
      - name: App Store artwork
        if: env.STORES != 'google'
        continue-on-error: true
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: python tool/upload_app_store_artwork.py ${{ steps.build.outputs.version }}

      - name: App Store submission
        if: env.STORES != 'google'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane submit_ios version:${{ steps.build.outputs.version }} build:${{ steps.build.outputs.ios }}

      - name: Google Play
        # Also when the App Store step failed - the two stores are independent.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.STORES != 'apple' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane store_android build:${{ steps.build.outputs.android }}
