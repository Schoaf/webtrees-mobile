name: Download store texts (one-off)

# Fetches the current store texts from App Store Connect and Google Play once,
# to put them under fastlane/metadata. Removed again afterwards.
on: workflow_dispatch

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Write keys
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          jq -n --arg k "$ASC_KEY_ID" --arg i "$ASC_ISSUER_ID" --arg c "$ASC_KEY" \
            '{key_id: $k, issuer_id: $i, key: $c, in_house: false}' > "$RUNNER_TEMP/asc.json"
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play.json"

      - name: App Store
        run: bundle exec fastlane deliver download_metadata --api_key_path "$RUNNER_TEMP/asc.json" --metadata_path out/ios --force

      - name: Google Play
        run: bundle exec fastlane supply init --json_key "$RUNNER_TEMP/play.json" --metadata_path out/android

      - uses: actions/upload-artifact@v7
        with:
          name: store-texts
          path: |
            out/**/*.txt
            out/**/*_url
