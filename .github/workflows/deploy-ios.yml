name: Deploy iOS to TestFlight

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Fail fast instead of uploading a build Apple will reject later.
      - name: Check version train is still open
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          python3 -m venv /tmp/asc && /tmp/asc/bin/pip install -q pyjwt cryptography
          /tmp/asc/bin/python tool/check_ios_version_train.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Download provisioning profile
        id: profiles
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: net.webtrees.webtreesmobile
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

      # Manual signing (not automatic) since there's no interactive Xcode
      # account session on the runner. There can be more than one ACTIVE
      # App Store profile for this bundle id (e.g. an old Xcode-managed one
      # alongside the manually-managed one this pipeline actually needs -
      # an Xcode-managed profile can't be used with CODE_SIGN_STYLE=Manual
      # at all), so this selects by exact name rather than taking index 0.
      # Must match PROVISIONING_PROFILE_SPECIFIER in ios/Flutter/Release.xcconfig.
      # Passed via `env` (not inlined into the script) so the JSON's own
      # quote characters can't collide with the shell/python quoting.
      - name: Write ExportOptions.plist
        env:
          PROFILES_JSON: ${{ steps.profiles.outputs.profiles }}
        run: |
          PROFILE_NAME=$(python3 -c "
          import json, os
          profiles = json.loads(os.environ['PROFILES_JSON'])
          match = next(p for p in profiles if p['name'] == 'webtrees-mobile CI App Store')
          print(match['name'])
          ")
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>YU5BS285KA</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>net.webtrees.webtreesmobile</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Build IPA
        run: flutter build ipa --release --obfuscate --split-debug-info=build/symbols --export-options-plist=ios/ExportOptions.plist --build-number=${{ github.run_number }}

      # Dart symbols for translating obfuscated stack traces back
      # (flutter symbolize -i <trace> -d <file>). Native dSYMs go to App
      # Store Connect with the IPA (uploadSymbols in ExportOptions.plist).
      - uses: actions/upload-artifact@v4
        with:
          name: dart-symbols-ios-${{ github.run_number }}
          path: build/symbols

      - name: Locate built IPA
        id: ipa
        run: echo "path=$(find build/ios/ipa -name '*.ipa' | head -1)" >> "$GITHUB_OUTPUT"

      # wait-for-processing polls Apple with the same API token the whole
      # time, which can outlive the App Store Connect JWT's ~20min lifetime
      # on a slow processing run and fail with a spurious 401 - the actual
      # upload has already succeeded by that point regardless, so don't
      # wait; check processing status in App Store Connect directly.
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          wait-for-processing: 'false'
          uses-non-exempt-encryption: 'false'
